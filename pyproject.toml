[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-optimiser"
version = "0.1.0"
description = "Deterministic routing from supplied model costs and quality evidence"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lco = "llm_cost_optimiser.cli:main"

[tool.setuptools.packages.find]
include = ["llm_cost_optimiser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
